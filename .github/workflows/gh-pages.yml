name: blog::gh_pages

on:
  # Runs on pushes targeting the public deployment branch
  push:
    branches: ["live"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  actions: read
  pages: write
  id-token: write
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-gh-pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 10
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
      - name: Install Typst
        uses: typst-community/setup-typst@v4
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: pnpm install
      - run: make all
      - run: pnpm build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for artifact availability
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PAGES_RUN_ID: ${{ github.run_id }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in $(seq 1 15); do
            artifact_id=$(gh api "repos/$GH_REPO/actions/runs/$PAGES_RUN_ID/artifacts" \
              --jq ".artifacts[] | select(.name == \"$PAGES_ARTIFACT_NAME\") | .id")
            if [ -n "$artifact_id" ]; then
              echo "Pages artifact is available: $artifact_id"
              exit 0
            fi
            sleep 2
          done
          echo "Pages artifact did not become available" >&2
          exit 1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
